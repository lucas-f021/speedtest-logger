<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trends · Speed Test Logger</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="trends-body">
  <div class="trends-page">
    <header class="trends-header">
      <div class="trends-header-left">
        <a href="/" class="back-link">&larr; Dashboard</a>
        <h1>Trends</h1>
      </div>
      <span class="trends-header-sub" id="report-title"></span>
    </header>

    <main class="report-main">
      <!-- Left: the selected month's stats, with the month picker below -->
      <div class="report-left">
        <div id="month-panel"></div>
        <section class="trends-panel picker-panel">
          <h2 class="panel-title">Months</h2>
          <div id="month-list" class="month-list"></div>
        </section>
      </div>

      <!-- Right: the selected month's ISO weeks, one stat box each -->
      <div id="week-grid" class="week-grid"></div>
    </main>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="trends.js"></script>
</body>
</html>
