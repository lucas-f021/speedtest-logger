<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Speed Test Logger</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>Speed Test Logger</h1>
    <div class="header-right">
      <span id="status-indicator" class="status-idle" title="Server status"></span>
      <button id="test-now-btn" class="btn-primary">
        <span id="btn-text">Test Now</span>
        <span id="btn-spinner" class="spinner hidden"></span>
      </button>
    </div>
  </header>

  <main>
    <section class="stats-bar" id="stats-bar">
      <div class="stat-card">
        <div class="stat-label">Avg Download</div>
        <div class="stat-value" id="stat-download">—</div>
        <div class="stat-unit">Mbps</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Avg Upload</div>
        <div class="stat-value" id="stat-upload">—</div>
        <div class="stat-unit">Mbps</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Avg Ping</div>
        <div class="stat-value" id="stat-ping">—</div>
        <div class="stat-unit">ms</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Total Tests</div>
        <div class="stat-value" id="stat-total">—</div>
        <div class="stat-unit">runs</div>
      </div>
    </section>

    <section class="chart-section">
      <div class="range-selector">
        <button class="range-btn" data-range="1h">1h</button>
        <button class="range-btn" data-range="6h">6h</button>
        <button class="range-btn active" data-range="24h">24h</button>
        <button class="range-btn" data-range="7d">7d</button>
        <button class="range-btn" data-range="30d">30d</button>
        <button class="range-btn" data-range="all">All</button>
      </div>
      <div class="chart-wrapper">
        <canvas id="speed-chart"></canvas>
      </div>
    </section>

    <section class="table-section">
      <h2>Test Log</h2>
      <div class="table-wrapper">
        <table id="log-table">
          <thead>
            <tr>
              <th>Timestamp</th>
              <th>Download</th>
              <th>Upload</th>
              <th>Ping</th>
              <th>Server</th>
              <th>Source</th>
            </tr>
          </thead>
          <tbody id="log-tbody">
            <tr><td colspan="6" class="empty-state">No data yet</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <div id="toast" class="toast hidden"></div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns"></script>
  <script src="app.js"></script>
</body>
</html>
